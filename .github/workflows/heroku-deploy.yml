name: Deploy to Heroku

on:
  push:
    branches: [ main ]

jobs:
  deploy-user-service:
    runs-on: ubuntu-latest
    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Deploy user-service
      run: |
        git push --force https://heroku:${HEROKU_API_KEY}@git.heroku.com/n22dccn070-user-service.git $(git subtree split --prefix user-service HEAD):refs/heads/main

  deploy-product-service:
    runs-on: ubuntu-latest
    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Deploy product-service
      run: |
        git push --force https://heroku:${HEROKU_API_KEY}@git.heroku.com/n22dccn070-product-service.git $(git subtree split --prefix product-service HEAD):refs/heads/main

  deploy-order-service:
    runs-on: ubuntu-latest
    needs: [deploy-user-service, deploy-product-service]
    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Deploy order-service
      run: |
        git push --force https://heroku:${HEROKU_API_KEY}@git.heroku.com/n22dccn070-order-service.git $(git subtree split --prefix order-service HEAD):refs/heads/main

  deploy-api-gateway:
    runs-on: ubuntu-latest
    needs: [deploy-user-service, deploy-product-service, deploy-order-service]
    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Deploy api-gateway
      run: |
        git push --force https://heroku:${HEROKU_API_KEY}@git.heroku.com/n22dccn070-api-gateway.git $(git subtree split --prefix api-gateway HEAD):refs/heads/main