name: Deploy to Heroku

on:
  push:
    branches: [ main ]

jobs:
  deploy-user-service:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: akhileshns/heroku-deploy@v3.13.15
      with:
        heroku_api_key: ${{secrets.HEROKU_API_KEY}}
        heroku_app_name: "n22dccn070-user-service"
        heroku_email: "n22dccn070@student.ptithcm.edu.vn"
        appdir: "user-service"

  deploy-product-service:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: akhileshns/heroku-deploy@v3.13.15
      with:
        heroku_api_key: ${{secrets.HEROKU_API_KEY}}
        heroku_app_name: "n22dccn070-product-service"
        heroku_email: "n22dccn070@student.ptithcm.edu.vn"
        appdir: "product-service"

  deploy-order-service:
    runs-on: ubuntu-latest
    needs: [deploy-user-service, deploy-product-service]
    steps:
    - uses: actions/checkout@v4
    - uses: akhileshns/heroku-deploy@v3.13.15
      with:
        heroku_api_key: ${{secrets.HEROKU_API_KEY}}
        heroku_app_name: "n22dccn070-order-service"
        heroku_email: "n22dccn070@student.ptithcm.edu.vn"
        appdir: "order-service"

  deploy-api-gateway:
    runs-on: ubuntu-latest
    needs: [deploy-user-service, deploy-product-service, deploy-order-service]
    steps:
    - uses: actions/checkout@v4
    - uses: akhileshns/heroku-deploy@v3.13.15
      with:
        heroku_api_key: ${{secrets.HEROKU_API_KEY}}
        heroku_app_name: "n22dccn070-api-gateway"
        heroku_email: "n22dccn070@student.ptithcm.edu.vn"
        appdir: "api-gateway"
